<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Hello, I am Deepak</title>
  <desc id="desc">A minimal creative GitHub profile banner for Deepak Gupta, product thinker and frontend builder.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#070A12"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#08111F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.52" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" x2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.55" stop-color="#D8B4FE"/>
      <stop offset="1" stop-color="#86EFAC"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="27" fill="none" stroke="#1D4ED8" stroke-width="2"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)" opacity="0.32"/>

  <circle cx="1060" cy="68" r="130" fill="#1D4ED8" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="228" cy="272" r="160" fill="#8B5CF6" opacity="0.07" filter="url(#softGlow)"/>

  <path d="M64 246 C238 170 344 280 515 203 C677 130 769 96 928 85 C1031 78 1094 54 1138 36"
        fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <path d="M64 247 C238 171 344 281 515 204 C677 131 769 97 928 86 C1031 79 1094 55 1138 37"
        fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" opacity="0.08"/>

  <g transform="translate(84 78)">
    <rect width="220" height="58" rx="18" fill="#0B1120" stroke="#263244"/>
    <circle cx="34" cy="29" r="6" fill="#8B5CF6"/>
    <text x="56" y="36" fill="#CBD5E1" font-family="Fira Code, Consolas, monospace" font-size="16" font-weight="700">divi-24.build()</text>
  </g>

  <g transform="translate(84 156)">
    <text x="0" y="0" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="5">PRODUCT THINKER / FRONTEND BUILDER</text>
    <text x="0" y="72" fill="url(#headline)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="68" font-weight="900">Hello, I am Deepak.</text>
    <text x="3" y="113" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="600">I design clear systems and ship useful digital products.</text>
  </g>

  <g transform="translate(838 188)">
    <rect width="122" height="36" rx="18" fill="#171B2A" stroke="#374151"/>
    <text x="61" y="24" text-anchor="middle" fill="#C4B5FD" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">DESIGN</text>
    <rect x="138" width="104" height="36" rx="18" fill="#102116" stroke="#285A39"/>
    <text x="190" y="24" text-anchor="middle" fill="#86EFAC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">BUILD</text>
    <rect x="258" width="92" height="36" rx="18" fill="#251A08" stroke="#6B4B13"/>
    <text x="304" y="24" text-anchor="middle" fill="#FCD34D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">SHIP</text>
  </g>

  <g transform="translate(991 78)">
    <rect width="96" height="96" rx="28" fill="#0B1120" stroke="#263244"/>
    <path d="M48 21 L75 48 L48 75 L21 48 Z" fill="none" stroke="#22C55E" stroke-width="7" stroke-linejoin="round"/>
    <path d="M48 21 V75" stroke="#8B5CF6" stroke-width="6" stroke-linecap="round"/>
    <text x="48" y="132" text-anchor="middle" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="900" letter-spacing="2.5">DIVI-24</text>
  </g>
</svg>
