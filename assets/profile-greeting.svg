<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Hello! I am Deepak</title>
  <desc id="desc">A cinematic developer profile banner for Deepak Gupta, product thinker, frontend builder, and systems shaper.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#080B12"/>
      <stop offset="0.46" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.48" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="text" x1="0" x2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.52" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#86EFAC"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.55 0 0 0 0 0.36 0 0 0 0 0.96 0 0 0 0.55 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#263244" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#334155"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)" opacity="0.52"/>

  <path d="M0 286 C165 210 247 331 395 252 C543 172 653 186 777 119 C914 45 1058 71 1200 18 L1200 360 L0 360 Z" fill="#111827" opacity="0.78"/>
  <path d="M18 281 C178 207 260 319 401 246 C548 170 653 181 777 114 C914 40 1059 67 1182 24" fill="none" stroke="url(#beam)" stroke-width="4" opacity="0.92" filter="url(#glow)"/>
  <path d="M80 296 L243 246 L392 276 L548 204 L713 226 L872 132 L1031 150 L1134 88" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.45"/>

  <g transform="translate(58 56)">
    <rect width="320" height="204" rx="18" fill="#0D1117" stroke="#263244"/>
    <circle cx="32" cy="30" r="6" fill="#EF4444"/>
    <circle cx="54" cy="30" r="6" fill="#F59E0B"/>
    <circle cx="76" cy="30" r="6" fill="#22C55E"/>
    <text x="28" y="78" fill="#8B5CF6" font-family="Fira Code, Consolas, monospace" font-size="18" font-weight="700">const deepak = {</text>
    <text x="50" y="111" fill="#E5E7EB" font-family="Fira Code, Consolas, monospace" font-size="17">mind: "product",</text>
    <text x="50" y="144" fill="#E5E7EB" font-family="Fira Code, Consolas, monospace" font-size="17">craft: "frontend",</text>
    <text x="50" y="177" fill="#E5E7EB" font-family="Fira Code, Consolas, monospace" font-size="17">habit: "ship"</text>
    <text x="28" y="210" fill="#8B5CF6" font-family="Fira Code, Consolas, monospace" font-size="18" font-weight="700">};</text>
  </g>

  <g transform="translate(430 72)">
    <text x="0" y="38" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">PRODUCT THINKER / FRONTEND BUILDER / SYSTEMS SHAPER</text>
    <text x="0" y="112" fill="url(#text)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="68" font-weight="900">Hello, I am Deepak</text>
    <text x="3" y="158" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">I turn ambitious ideas into useful digital products.</text>
    <g transform="translate(2 194)">
      <rect width="162" height="38" rx="10" fill="#1F2937" stroke="#374151"/>
      <text x="81" y="25" text-anchor="middle" fill="#C4B5FD" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">DESIGN WITH INTENT</text>
      <rect x="178" width="132" height="38" rx="10" fill="#13241B" stroke="#285A39"/>
      <text x="244" y="25" text-anchor="middle" fill="#86EFAC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">BUILD WITH CARE</text>
      <rect x="326" width="126" height="38" rx="10" fill="#2A1E0A" stroke="#6B4B13"/>
      <text x="389" y="25" text-anchor="middle" fill="#FCD34D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">SHIP WHAT HELPS</text>
    </g>
  </g>

  <g opacity="0.85">
    <rect x="1006" y="58" width="112" height="112" rx="20" fill="#0D1117" stroke="#263244"/>
    <path d="M1033 120 L1058 95 L1083 120 L1058 145 Z" fill="none" stroke="#22C55E" stroke-width="6" stroke-linejoin="round"/>
    <path d="M1058 95 V145" stroke="#8B5CF6" stroke-width="5" stroke-linecap="round"/>
    <text x="1062" y="206" text-anchor="middle" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="2">DIVI-24</text>
  </g>
</svg>
